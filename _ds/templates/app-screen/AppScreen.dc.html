<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Manuva app screen" description="Product shell: domain-accented sidebar, top bar, metric row and a dense data table." -->
<helmet>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<a href="#" style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none"><span style="width:3px;height:14px;border-radius:1px;background:transparent"></span>Purchasing<span style="margin-left:auto;font-size:11px;color:var(--ink-faint)">7</span></a>

<a href="#" style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none"><span style="width:3px;height:14px;border-radius:1px;background:transparent"></span>Products &amp; BOMs</a>

<h1 style="margin:0;font-family:var(--font-display);font-variation-settings:'wdth' 100,'wght' 700;font-size:26px;line-height:1.1;letter-spacing:-0.022em;color:var(--ink-strong)">Stock on hand</h1>
</div>
<x-import component-from-global-scope="ManuvaDesignSystem_169665.Button" size="sm" variant="secondary" hint-size="90px,32px">Export</x-import>
<x-import component-from-global-scope="ManuvaDesignSystem_169665.Button" size="sm" hint-size="120px,32px">Goods inwards</x-import>
</header>
<div style="flex:1;overflow:auto;padding:24px;display:grid;gap:16px;align-content:start;max-width:1400px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div style="background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:8px;overflow:hidden"><div style="height:3px;background:var(--accent-loud)"></div><div style="padding:16px;display:grid;gap:4px"><span class="mv-key">Units on hand</span><span style="display:flex;align-items:baseline;gap:4px"><span class="mv-numeral" style="font-size:40px;color:var(--ink-strong)">67,142</span><span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-faint)">ea</span></span></div></div>
<div style="background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:8px;padding:16px;display:grid;gap:4px"><span class="mv-key">Allocated</span><span style="display:flex;align-items:baseline;gap:4px"><span class="mv-numeral" style="font-size:40px;color:var(--ink-strong)">14,904</span><span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-faint)">ea</span></span></div>
<div style="background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:8px;padding:16px;display:grid;gap:4px"><span class="mv-key">Below reorder</span><span class="mv-numeral" style="font-size:40px;color:var(--danger)">9</span></div>
<div style="background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:8px;padding:16px;display:grid;gap:4px"><span class="mv-key">Stock value</span><span class="mv-numeral" style="font-size:40px;color:var(--ink-strong)">$412k</span></div>
</div>
<div style="background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:8px;overflow:hidden">
<x-import component-from-global-scope="ManuvaDesignSystem_169665.DataTable" density="compact" columns="{{ columns }}" rows="{{ rows }}" hint-size="100%,280px"></x-import>
</div>
</div>
</main>
</div>

        { key: "name", header: "Product" },

  }
}
</script>
</body>
</html>
