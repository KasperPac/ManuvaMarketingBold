<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Manuva poster / OG card" description="Tier-1 brand surface: full-bleed colour field, cropped hero numeral, one declarative line." -->
<helmet>
<script src="./ds-base.js"></script>
<style>body{margin:0;background:var(--graphite-100);display:grid;place-items:center;min-height:100vh;font-family:var(--font-body)}</style>
</helmet>
<div style="width:1200px;height:630px;position:relative;overflow:hidden;background: {{ field }};color: {{ ink }};padding:72px;display:grid;align-content:space-between;box-sizing:border-box">
<sc-if value="{{ showNumeral }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" class="mv-numeral" style="position:absolute;right:-0.05em;bottom:-0.30em;font-size:520px;color:color-mix(in srgb, currentColor 11%, transparent);pointer-events:none">1,240</span></sc-if>
<span class="mv-eyebrow" style="position:relative;justify-self:start;font-size:15px;padding:8px 14px;background:#C8FF2E;color:#141413">Manuva · Inventory</span>
<div style="position:relative;display:grid;gap:24px">
<h1 class="mv-display" style="margin:0;font-size:96px;max-width:15ch">Know before the line stops.</h1>
<p style="margin:0;max-width:44ch;font-size:26px;line-height:1.45;color:currentColor;opacity:.76">Inventory, BOMs, work orders and stock control — connected, live, and built for the floor.</p>
</div>
<div style="position:relative;display:flex;align-items:center;justify-content:space-between;border-top:4px solid color-mix(in srgb, currentColor 26%, transparent);padding-top:26px">
<span role="img" aria-label="Manuva" style="display:inline-block;height:34px;width:154px;background-color:currentColor;-webkit-mask-image:url(../../assets/logo-lockup.svg);mask-image:url(../../assets/logo-lockup.svg);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain"></span>
<span style="font-size:20px;font-weight:600;color:currentColor;opacity:.62">manuva.app</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630},&quot;field&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cobalt&quot;,&quot;violet&quot;,&quot;flare&quot;,&quot;amber&quot;,&quot;mint&quot;,&quot;aqua&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;cobalt&quot;,&quot;tsType&quot;:&quot;\&quot;cobalt\&quot; | \&quot;violet\&quot; | \&quot;flare\&quot; | \&quot;amber\&quot; | \&quot;mint\&quot; | \&quot;aqua\&quot; | \&quot;ink\&quot;&quot;,&quot;section&quot;:&quot;Poster&quot;,&quot;label&quot;:&quot;Field&quot;},&quot;showNumeral&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Poster&quot;,&quot;label&quot;:&quot;Cropped hero numeral&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    /* Every field is a marketing field from tokens/marketing.css, paired with
       the ink that clears AA on it. The accent is never the whole field —
       it carries the eyebrow only. */
    const FIELDS = {
      cobalt: ["#3A5EFF", "#FFFFFF"],
      violet: ["#B026FF", "#FFFFFF"],
      flare:  ["#FF4D00", "#FFFFFF"],
      amber:  ["#FFB300", "#141413"],
      mint:   ["#00C271", "#141413"],
      aqua:   ["#00B9D6", "#141413"],
      ink:    ["#15314D", "#FFFFFF"]
    };
    const f = FIELDS[p.field] || FIELDS.cobalt;
    return {
      field: f[0],
      ink: f[1],
      showNumeral: p.showNumeral !== false
    };
  }
}
</script>
</body>
</html>
