<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Manuva — app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script>window.MV = window.ManuvaDesignSystem_169665;</script>
<style>html,body{height:100%;margin:0;overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Inventory.jsx"></script>
<script type="text/babel" src="Production.jsx"></script>
<script type="text/babel" src="Purchasing.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const { Toast, Dialog, Button, EmptyState, PageHeader, Icon } = window.MV;

const STUB={
  products:["Operations","Products","Browse Shopify products, variants, and BOM readiness."],
  components:["Operations","Components","Every purchasable and manufacturable part, with cost, supplier and bin."],
  templates:["Operations","Templates","Reusable BOM templates applied across product families."],
  "goods-inwards":["Operations","Goods Inwards","Receive against a PO and post the movement."],
  orders:["Operations","Orders","Pipeline view: component readiness, production state, and delivery state per order."],
  stocktake:["Operations","Stocktake","Count sessions with expected-vs-counted variance."],
  suppliers:["Operations","Suppliers","Lead times, price lists and delivery accuracy."],
  reports:["Operations","Reports","Valuation, dead stock, PO variance, spend by supplier."],
  locations:["Warehouse","Locations","Warehouses and bin locations."],
  "activity-log":["Workspace","Activity Log","Append-only record of who changed what, when."],
  trash:["Workspace","Trash","Soft-deleted records, restorable for 30 days."],
  tenants:["Platform","Tenants","Every customer workspace on this deployment."],
  "audit-log":["Platform","Audit log","Platform-level access and permission changes."],
  team:["Platform","Team","People, roles and permissions in this workspace."]
};

function App(){
  const [view,setView]=React.useState("dashboard");
  const [invTab,setInvTab]=React.useState("all");
  const [prodTab,setProdTab]=React.useState("open");
  const [purTab,setPurTab]=React.useState("open");
  const [poDetail,setPoDetail]=React.useState(null);
  const [dialog,setDialog]=React.useState(null);
  const [toast,setToast]=React.useState(null);

  const fire=(t,d)=>{setDialog(null);setToast({title:t,detail:d});setTimeout(()=>setToast(null),3400);};

  let body;
  if(view==="dashboard") body=<Dashboard/>;
  else if(view==="inventory") body=<Inventory tab={invTab} setTab={setInvTab}/>;
  else if(view==="purchasing") body=<Purchasing tab={purTab} setTab={setPurTab} detail={poDetail} setDetail={setPoDetail} onSend={()=>setDialog("send")}/>;
  else if(STUB[view]){
    const [eyebrow,title,desc]=STUB[view];
    body=(<div style={{display:"flex",flexDirection:"column",gap:"18px"}}>
      <PageHeader eyebrow={eyebrow} title={title} description={desc}/>
      <EmptyState numeral="0" title={"“"+title+"” is not in this kit"}
        message="Four screens are recreated in full: Dashboard, Inventory, Purchasing (list + PO detail) and Production. The rest are listed here so the navigation matches the shipped app."
        action={<Button size="sm" variant="secondary" onClick={()=>setView("dashboard")}>Back to dashboard</Button>}/>
    </div>);
  }
  else body=<Production tab={prodTab} setTab={setProdTab} onRelease={()=>setDialog("release")}/>;

  return (<>
    <AppShell view={view} setView={v=>{setPoDetail(null);setView(v);}}
      impersonating="Fabulous Fabrications"
      topbar={<ShellTopBar/>}>{body}</AppShell>
    <Dialog open={dialog==="release"} eyebrow="Operations" title="Release WO-4195?" onClose={()=>setDialog(null)}
      footer={<><Button variant="secondary" onClick={()=>setDialog(null)}>Cancel</Button>
        <Button onClick={()=>fire("WO-4195 released","80 units · Assembly 2 · due Wed 19 Aug")}>Release job</Button></>}>
      80 units of Shelf kit, 4-tier. Releasing allocates stock to the job and writes a reservation movement.
    </Dialog>
    <Dialog open={dialog==="send"} eyebrow="Operations" title="Send PO-1039 to Gasflow Pty Ltd?" onClose={()=>setDialog(null)}
      footer={<><Button variant="secondary" onClick={()=>setDialog(null)}>Cancel</Button>
        <Button onClick={()=>fire("PO-1039 sent","Gasflow Pty Ltd · 2 lines · $1,320")}>Send PO</Button></>}>
      2 lines · $1,320 ex GST. The supplier receives a PDF copy and the lines become expected stock.
    </Dialog>
    {toast&&<div style={{position:"fixed",left:"calc(var(--sidebar-w) + 20px)",bottom:20,zIndex:200}}>
      <Toast tone="success" title={toast.title} detail={toast.detail} onClose={()=>setToast(null)}/></div>}
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
})();
</script></body></html>
