<!-- @dsCard group="Marketing site" viewport="1200x630" name="OG / social card" subtitle="1200×630. Full field, cropped numeral, one line. Rotate the field per campaign." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--graphite-100)}
.og{width:1200px;height:630px;position:relative;overflow:hidden;box-sizing:border-box;
padding:76px;display:grid;align-content:space-between;
background:var(--field-cobalt);color:var(--on-cobalt)}
.wm{position:absolute;right:-.06em;bottom:-.34em;font-size:540px;color:rgb(255 255 255/.11);pointer-events:none}
.hl{font-family:var(--font-display);font-variation-settings:"wdth" 118,"wght" 800;font-weight:800;
line-height:.98;letter-spacing:var(--ls-mega);margin:0}</style>
</head><body>
<div class="og">
<span aria-hidden="true" class="mv-numeral wm">1,240</span>
<div style="position:relative;display:flex;align-items:center;gap:14px">
<span style="background:var(--field-lime);color:var(--on-lime);padding:7px 14px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Inventory</span>
<span style="font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:rgb(255 255 255/.6)">Manuva</span>
</div>
<div style="position:relative;display:grid;gap:26px">
<h1 class="hl" style="font-size:104px;max-width:13ch">Know before the line stops.</h1>
<p style="margin:0;max-width:42ch;font-size:27px;line-height:1.4;color:rgb(255 255 255/.78)">Live stock checked against every BOM, before the job hits the floor.</p>
</div>
<div style="position:relative;display:flex;align-items:center;justify-content:space-between;border-top:5px solid rgb(255 255 255/.28);padding-top:28px">
<img src="../../assets/logo-lockup.svg" style="height:36px;filter:invert(1)" alt="Manuva">
<span class="mv-mono" style="font-size:21px;color:rgb(255 255 255/.62)">manuva.app</span>
</div>
</div></body></html>
