<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-card);font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div style="display:grid;gap:9px"><span class="mv-key" style="color:var(--ok)">Do</span><span style="font-size:13px;color:var(--ink);border-left:3px solid var(--ok);padding-left:9px">“3 components short for job 4192.”</span><span style="font-size:13px;color:var(--ink);border-left:3px solid var(--ok);padding-left:9px">“Sent PO-1042 to Kingsgrove Metals.”</span><span style="font-size:13px;color:var(--ink);border-left:3px solid var(--ok);padding-left:9px">“Stock is live from the floor.”</span><span style="font-size:13px;color:var(--ink);border-left:3px solid var(--ok);padding-left:9px">“Coverage: 14 days.”</span></div>
