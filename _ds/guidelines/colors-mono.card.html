<!-- @dsCard group="Colors" viewport="700x150" name="Monochrome fallback" subtitle="POs and packing slips print black on white — status reads by label and rule weight." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-card);font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:24px;align-items:flex-start">
<div style="flex:1;border:1px solid #92928A;border-radius:2px;padding:12px;background:#fff;display:grid;gap:8px">
<span style="font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#42423C">Purchase order</span>
<span style="font-family:var(--font-display);font-variation-settings:'wdth' 118,'wght' 800;font-size:26px;letter-spacing:-.03em;color:#000">PO-1042</span>
<div style="border-top:3px solid #000;padding-top:6px;display:flex;gap:6px">
<span style="border:1px solid #000;padding:1px 6px;font-size:10px;font-weight:700;text-transform:uppercase">Confirmed</span>
<span style="border:1px dashed #42423C;padding:1px 6px;font-size:10px;font-weight:700;text-transform:uppercase;color:#42423C">Partial</span>
</div></div>
<ul style="flex:1;margin:0;padding-left:16px;font-size:12px;color:var(--ink-muted);line-height:1.7">
<li>Colour never carries meaning alone — every status also has a word.</li>
<li>Solid rule = confirmed. Dashed = pending. Hairline = informational.</li>
<li>Print tokens override automatically inside <span class="mv-mono">@media print</span>.</li>
</ul></div></body></html>
