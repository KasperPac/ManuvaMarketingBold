<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-card-alt);font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:20px"><div style="display:grid;gap:8px;justify-items:center"><div style="width:100px;height:56px;background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:var(--radius-xl);box-shadow:none"></div><span class="mv-mono" style="font-size:9px;color:var(--ink-faint);text-align:center">none<br>flat — tables</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:100px;height:56px;background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)"></div><span class="mv-mono" style="font-size:9px;color:var(--ink-faint);text-align:center">shadow-sm<br>hover</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:100px;height:56px;background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-card)"></div><span class="mv-mono" style="font-size:9px;color:var(--ink-faint);text-align:center">shadow-card<br>cards, panels</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:100px;height:56px;background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-md)"></div><span class="mv-mono" style="font-size:9px;color:var(--ink-faint);text-align:center">shadow-md<br>popover, drawer</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:100px;height:56px;background:var(--bg-card);border:1px solid var(--stroke-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg)"></div><span class="mv-mono" style="font-size:9px;color:var(--ink-faint);text-align:center">shadow-lg<br>dialog, dropdown</span></div></div></body></html>
