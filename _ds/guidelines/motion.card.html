<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="Mechanical: fast start, firm stop, no overshoot, no bounce." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-card);font-family:var(--font-body)}</style></head><body><div style="display:grid;gap:12px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:grid;gap:4px;padding:9px 10px;border:1px solid var(--stroke-card);border-radius:var(--radius-2)"><span class="mv-mono" style="font-size:11px;color:var(--ink-strong)">80ms</span><span class="mv-key">--dur-instant</span><span style="font-size:10px;color:var(--ink-faint)">hover, press</span></div><div style="display:grid;gap:4px;padding:9px 10px;border:1px solid var(--stroke-card);border-radius:var(--radius-2)"><span class="mv-mono" style="font-size:11px;color:var(--ink-strong)">140ms</span><span class="mv-key">--dur-fast</span><span style="font-size:10px;color:var(--ink-faint)">toggles, tabs</span></div><div style="display:grid;gap:4px;padding:9px 10px;border:1px solid var(--stroke-card);border-radius:var(--radius-2)"><span class="mv-mono" style="font-size:11px;color:var(--ink-strong)">200ms</span><span class="mv-key">--dur-base</span><span style="font-size:10px;color:var(--ink-faint)">popovers, drawers</span></div><div style="display:grid;gap:4px;padding:9px 10px;border:1px solid var(--stroke-card);border-radius:var(--radius-2)"><span class="mv-mono" style="font-size:11px;color:var(--ink-strong)">320ms</span><span class="mv-key">--dur-slow</span><span style="font-size:10px;color:var(--ink-faint)">dialogs, pages</span></div></div>
<span style="font-size:11px;color:var(--ink-muted)">Standard easing <span class="mv-mono">cubic-bezier(.2,.8,.3,1)</span> · state flips <span class="mv-mono">cubic-bezier(.1,.9,.2,1)</span> · nothing scales past 1.0 · the only looping animation is the live-data pulse.</span></div></body></html>
